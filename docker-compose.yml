services:
  db:
    image: postgres:16
    container_name: company-agent-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent
    ports:
      - "5433:5432"        # 5433 so it won't clash with another Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: